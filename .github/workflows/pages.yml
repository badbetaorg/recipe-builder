name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-c83cf0e5-hztmyx, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check recipes and layout
        run: |
          npm run validate
          npm run build
          git diff --exit-code data/recipes.js
          npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js data _site/
          rm -rf _site/data/batches
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
