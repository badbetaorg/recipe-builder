<!doctype html>
<html lang="en">
<head>

<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#/">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <rect x="1" y="1" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="9" y1="1" x2="9" y2="25" stroke="currentColor" stroke-width="2"/>
          <line x1="1" y1="9" x2="9" y2="9" stroke="currentColor" stroke-width="2"/>
          <line x1="1" y1="17" x2="9" y2="17" stroke="currentColor" stroke-width="2"/>

        <span>Recipe Grid</span>
      </a>
      <nav aria-label="Main">
        <a href="#/" data-nav="all">Recipes</a>
        <a href="#/mine" data-nav="mine">My recipes</a>
        <a href="walkthrough.html">How to read</a>
